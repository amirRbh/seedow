# PROBE read-only : mesure la couverture Yahoo esgScores sur les ETF wirés
# (go/no-go, cf. docs/esg-sources.md). N'écrit RIEN — lit des symboles, interroge
# Yahoo, imprime un taux. Manuel uniquement.
name: Probe Yahoo ESG coverage

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre de symboles testés (défaut 50)"
        required: false
        default: "50"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe ESG coverage
        env:
          PROBE_LIMIT: ${{ inputs.limit }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run scripts/probe-yahoo-esg.ts
