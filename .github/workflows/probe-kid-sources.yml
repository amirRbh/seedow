# PROBE read-only : joignabilité (depuis Actions) de sources SFDR/KID candidates
# pour ISIN IE/LU (cf. docs/esg-sources.md, pivot SFDR/KID). N'écrit RIEN, n'ingère
# RIEN — mesure statut HTTP + présence d'un signal SFDR. Manuel uniquement.
name: Probe KID/SFDR sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe KID/SFDR sources
        run: bun run scripts/probe-kid-sources.ts
