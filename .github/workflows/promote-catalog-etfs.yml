# Promotion CURÉE catalogue → moteur : insère des ETF de `catalog_instruments`
# (Adanos) dans `assets` en is_active=false. Volontairement MANUEL (workflow_dispatch
# uniquement, PAS de cron) : la promotion vers le moteur est un acte curé, opt-in —
# jamais automatique en masse. Non destructif : n'insère que des placeholders
# dormants + backfill du lien catalog_listing_key. Jamais d'activation ni d'ESG.
name: Promote catalog ETFs

on:
  workflow_dispatch:
    inputs:
      persist:
        description: "Écrire en base (nécessite les secrets Supabase)"
        type: boolean
        required: false
        default: false
      limit:
        description: "Plafond d'insertions (ex. 500 pour une 1re vague ; vide = tout)"
        required: false
        default: ""

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Promote catalog ETFs
        env:
          # Contrairement à l'import, le run manuel reste opt-in même déclenché à
          # la main : promouvoir dans le moteur doit être un choix explicite.
          SEEDOW_PERSIST: ${{ inputs.persist && '1' || '0' }}
          PROMOTE_LIMIT: ${{ inputs.limit }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run scripts/promote-catalog-etfs.ts
