# PROBE read-only : joignabilité (depuis Actions) + robots.txt des domaines de
# publication des KID des asset-managers (piste primaire suivante après le 0 % GECO,
# cf. docs/esg-sources.md). N'écrit RIEN, n'ingère RIEN, ne devine aucune URL de KID
# — mesure statut HTTP de la racine + ce que robots.txt autorise. Manuel uniquement.
name: Probe issuer KID reachability

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe issuer KID reachability
        run: bun run scripts/probe-issuer-kid.ts
