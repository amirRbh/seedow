# Wiring yahoo_symbol : pose un symbole Yahoo VALIDÉ sur une fournée curée d'ETF
# promus (dormants, is_active=false), pour amorcer l'accumulation de cours. Manuel
# uniquement (enrichissement curé, opt-in). Non destructif : ne touche que
# assets.yahoo_symbol, n'active aucun fonds.
name: Wire Yahoo symbols

on:
  workflow_dispatch:
    inputs:
      persist:
        description: "Écrire en base (nécessite les secrets Supabase)"
        type: boolean
        required: false
        default: false
      limit:
        description: "Nombre max d'ETF traités (défaut 50)"
        required: false
        default: "50"

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Wire Yahoo symbols
        env:
          SEEDOW_PERSIST: ${{ inputs.persist && '1' || '0' }}
          WIRE_LIMIT: ${{ inputs.limit }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run scripts/wire-yahoo-symbols.ts
