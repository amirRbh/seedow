# Enrichissement d'identité (issuer/region) des ETF promus, dérivé du nom. Maillon
# 2 : avec le wiring (maillon 1) + les cours accumulés, débloque l'activation auto.
# Manuel uniquement (curé, opt-in). Non destructif : ne remplit que des champs NULL,
# n'active aucun fonds.
name: Enrich catalog identity

on:
  workflow_dispatch:
    inputs:
      persist:
        description: "Écrire en base (nécessite les secrets Supabase)"
        type: boolean
        required: false
        default: false
      limit:
        description: "Nombre max d'ETF traités (défaut 500)"
        required: false
        default: "500"
      all:
        description: "Traiter tous les promus, pas seulement les wirés (1 = oui)"
        required: false
        default: ""

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Enrich identity
        env:
          SEEDOW_PERSIST: ${{ inputs.persist && '1' || '0' }}
          ENRICH_LIMIT: ${{ inputs.limit }}
          ENRICH_ALL: ${{ inputs.all }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run scripts/enrich-catalog-identity.ts
