# PROBE read-only : chaîne complète ISIN → holdings chez iShares en HTTP simple
# (sitemap déclaré par robots.txt → portfolioId → API produit). Mesure ce que les
# probes #1–#5 avaient conclu impossible — cf. docs/esg-holdings-beta.md.
# N'écrit RIEN, n'ingère rien, ne devine aucune URL. Manuel uniquement.
name: Probe iShares product API

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Nombre de fonds échantillonnés dans le sitemap"
        required: false
        default: "5"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe iShares product API
        env:
          SAMPLE: ${{ inputs.sample }}
        run: bun run scripts/probe-ishares-product-api.ts
