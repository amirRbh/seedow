# Opérations Seedow Pro sur la production.
#
# Déclenchement MANUEL uniquement (workflow_dispatch) : aucune opération en
# production ne part d'un simple commit. Les tâches qui écrivent en base
# exigent en plus `confirm` = JE-CONFIRME.
#
# Tâches (`task`) :
#   status       lecture seule : comptes, RLS, stockage, API, application, clé.
#   eval         précision de l'extraction sur les 7 annexes de référence
#                (appels Anthropic payants, plafonnés ; n'écrit rien en base).
#   fund-base    base UC : identité GECO, frais du KID, annexes isolées ; puis
#                extraction des annexes. Sans confirmation : préparation seule.
#   ingest-inbox traite les annexes déposées depuis /pro/fonds (écrit).
#   e2e          parcours complet sur l'app publiée, compte et client fictifs (écrit).
#
# Les secrets ne quittent jamais GitHub Actions : ANTHROPIC_API_KEY n'est lue que
# par les scripts de ce workflow, jamais par le Worker ni par le navigateur.
# Secrets : SUPABASE_DB_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
#           VITE_SUPABASE_PUBLISHABLE_KEY, ANTHROPIC_API_KEY.
name: Pro ops

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Opération"
        type: choice
        options: [status, eval, fund-base, ingest-inbox, e2e]
        default: status
      confirm:
        description: "Écriture en production : saisir JE-CONFIRME (fund-base, ingest-inbox, e2e)"
        required: false
        default: ""
      limit:
        description: "fund-base : nombre maximal de fonds (vide = tous)"
        required: false
        default: ""
      isins:
        description: "fund-base : ISIN ciblés, séparés par des virgules (vide = liste de départ)"
        required: false
        default: ""
      max_cost_usd:
        description: "Plafond de dépense Anthropic du run, en dollars"
        required: false
        default: "10"
      model:
        description: "Modèle d'extraction (vide = défaut du code)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pro-ops
  cancel-in-progress: false

env:
  EXTRACTION_MAX_COST_USD: ${{ inputs.max_cost_usd }}
  EXTRACTION_MODEL: ${{ inputs.model }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      task: ${{ steps.p.outputs.task }}
      write: ${{ steps.p.outputs.write }}
    steps:
      - id: p
        env:
          TASK: ${{ inputs.task }}
          CONFIRM: ${{ inputs.confirm }}
          MAX_COST: ${{ inputs.max_cost_usd }}
        run: |
          case "$TASK" in status|eval|fund-base|ingest-inbox|e2e) ;; *) echo "::error::Tâche inconnue"; exit 1;; esac
          if ! printf '%s' "$MAX_COST" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then echo "::error::Plafond invalide"; exit 1; fi
          write=false; [ "$CONFIRM" = "JE-CONFIRME" ] && write=true
          if { [ "$TASK" = ingest-inbox ] || [ "$TASK" = e2e ]; } && [ "$write" != true ]; then
            echo "::error::« $TASK » écrit en production : saisir JE-CONFIRME dans « confirm »."; exit 1
          fi
          echo "task=$TASK" >> "$GITHUB_OUTPUT"; echo "write=$write" >> "$GITHUB_OUTPUT"
          echo "Tâche : $TASK · écriture : $write · plafond : $MAX_COST \$"

  status:
    needs: plan
    if: needs.plan.outputs.task == 'status'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Installer psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: État de la production (lecture seule)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/pro/ops/status.sh | tee -a "$GITHUB_STEP_SUMMARY"

  eval:
    needs: plan
    if: needs.plan.outputs.task == 'eval'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - name: Évaluer l'extraction (ré-extraction complète)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run scripts/pro/eval-fixtures.ts --refresh
      - name: Résumé
        if: always()
        run: cat fixtures/annexes/extractions/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-extractions
          path: fixtures/annexes/extractions/

  fund-base:
    needs: plan
    if: needs.plan.outputs.task == 'fund-base'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Installer poppler (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - name: Identité GECO, frais du KID, annexes isolées
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WRITE: ${{ needs.plan.outputs.write }}
          LIMIT: ${{ inputs.limit }}
          ISINS: ${{ inputs.isins }}
        run: |
          args=(--out out/fund-base)
          [ -n "$LIMIT" ] && args+=(--limit "$LIMIT")
          [ -n "$ISINS" ] && args+=(--isins "$ISINS")
          [ "$WRITE" = true ] && args+=(--persist)
          bun run scripts/pro/build-fund-base.ts "${args[@]}"
      - name: Extraction des annexes (modèle)
        if: needs.plan.outputs.write == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if ls out/fund-base/annexes/*.pdf >/dev/null 2>&1; then
            bun run scripts/pro/ingest.ts out/fund-base/annexes --manifest out/fund-base/annexes/manifest.json
          else
            echo "Aucune annexe isolée : rien à extraire."
          fi
      - name: Résumé
        if: always()
        run: cat out/fund-base/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fund-base
          path: out/fund-base/

  ingest-inbox:
    needs: plan
    if: needs.plan.outputs.task == 'ingest-inbox'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - name: Traiter les annexes déposées
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run scripts/pro/ingest.ts --inbox

  e2e:
    needs: plan
    if: needs.plan.outputs.task == 'e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - name: Installer Playwright (hors lockfile, pour ce job seulement)
        run: |
          bun add playwright@1.57.0 --no-save
          bunx playwright install --with-deps chromium
      - name: Étapes 1 à 3 (connexion, cabinet, client fictif, dépôt d'annexe)
        run: bun run scripts/pro/e2e-prod.ts --phase upload
      - name: Étapes 4 et 5 (analyse de l'annexe déposée)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run scripts/pro/ingest.ts --inbox
      - name: Étapes 6 à 8 (correspondance, rapport, téléchargement) et isolation
        run: bun run scripts/pro/e2e-prod.ts --phase report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: out/e2e/
