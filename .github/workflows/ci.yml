name: CI

# Garde-fous qualité (CLAUDE.md §8) : typecheck, lint, format, tests sur chaque
# PR et sur main. Le déploiement (Vercel) reste séparé — ici on VALIDE, on ne
# déploie pas.
on:
  pull_request:
  push:
    branches: [main]

# Une exécution par ref : un nouveau push annule l'ancienne.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # Lockfile texte versionné = source unique (CLAUDE.md §6). --frozen-lockfile
      # échoue si package.json et bun.lock divergent (dérive interdite).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bunx prettier --check .

      - name: Tests
        run: bun run test
