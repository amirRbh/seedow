# Import du catalogue mondial Adanos (Free Global Ticker Database, MIT) dans
# `catalog_instruments`. Refresh gratuit, GitHub-native : l'Action tourne dans le
# réseau GitHub → atteint la release Adanos ET Supabase, sans limite Worker Edge.
# Non destructif : n'écrit que la couche catalogue (jamais `assets` ni l'ESG).
name: Import Adanos catalog

on:
  schedule:
    - cron: "0 4 * * 1" # hebdo, lundi 04h UTC — avant discover-funds (05h) / ingestion-plan (06h)
  workflow_dispatch:
    inputs:
      persist:
        description: "Écrire en base (nécessite les secrets Supabase)"
        type: boolean
        required: false
        default: false
      version:
        description: "Estampille source_version (ex. 3.32.00 ; vide = null)"
        required: false
        default: ""
      asset_types:
        description: "Filtre asset_type CSV (ex. 'etf' ; vide = tout)"
        required: false
        default: ""

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Import catalog
        env:
          # Le run planifié persiste toujours ; le run manuel reste opt-in.
          SEEDOW_PERSIST: ${{ (github.event_name == 'schedule' || inputs.persist) && '1' || '0' }}
          ADANOS_VERSION: ${{ inputs.version }}
          ADANOS_ASSET_TYPES: ${{ inputs.asset_types }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run scripts/import-adanos-catalog.ts
