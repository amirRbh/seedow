# Applique les migrations `supabase/migrations/` au projet, via la CLI officielle
# (`supabase db push --db-url`) — aucune édition manuelle du schéma, aucun access
# token requis (juste l'URL de connexion base).
# Déclenchement manuel. Secret requis :
#   SUPABASE_DB_URL  (chaîne de connexion « Session pooler », port 5432, IPv4)
#     ex. postgresql://postgres.<ref>:<motdepasse>@aws-0-<region>.pooler.supabase.com:5432/postgres
name: DB migrate (Supabase)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations (accepte DB_URL OU access token + mot de passe)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Secrets détectés : DB_URL=$([ -n "$SUPABASE_DB_URL" ] && echo oui || echo non)" \
               "ACCESS_TOKEN=$([ -n "$SUPABASE_ACCESS_TOKEN" ] && echo oui || echo non)" \
               "DB_PASSWORD=$([ -n "$SUPABASE_DB_PASSWORD" ] && echo oui || echo non)"
          if [ -n "$SUPABASE_DB_URL" ]; then
            supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes
          elif [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase link --project-ref jthpgbsxzzibqlfsatat --password "$SUPABASE_DB_PASSWORD"
            supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all --yes
          else
            echo "::error::Fournir soit SUPABASE_DB_URL, soit SUPABASE_ACCESS_TOKEN + SUPABASE_DB_PASSWORD."
            exit 1
          fi
          echo "Migrations appliquées. Vérification de 'assets' via REST (étape suivante)."
