# Applique le schéma `supabase/migrations/` à un projet Supabase vierge.
#
# Les migrations exportées par Lovable ne se rejouent PAS linéairement (des
# `CREATE TABLE` se recouvrent avec des définitions divergentes, des
# `cron.unschedule()` non gardés échouent sur base vierge). Plutôt que de
# modifier les fichiers de migration, on applique tout en mode TOLÉRANT
# (psql ON_ERROR_STOP=0) : les collisions d'idempotence (« already exists »,
# doublons) sont ignorées, le reste est appliqué. Chaque erreur ignorée est
# logguée, et celles de la dernière migration le sont INTÉGRALEMENT (le résumé
# global est agrégé puis tronqué : il ne peut pas servir de diagnostic).
#
# Le succès n'est PAS conditionné au seul `public.assets` : les tables déclarées
# par la dernière migration doivent exister, sinon le run échoue. Un workflow qui
# rend « vert » une migration qui n'a rien créé est pire qu'un workflow absent —
# il fait croire que la base est à jour.
#
# Secret requis : SUPABASE_DB_URL (chaîne « Session pooler », port 5432, IPv4).
name: DB migrate (Supabase)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Installer psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Pré-enregistrer les jobs pg_cron (les migrations font unschedule)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::error::Secret SUPABASE_DB_URL manquant."; exit 1; fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=0 <<'SQL'
          do $$
          begin
            perform cron.schedule('refresh-market-data-hourly', '0 * * * *', 'select 1');
            perform cron.schedule('refresh-market-data-daily',  '0 2 * * *', 'select 1');
            perform cron.schedule('dispatch-notifications-daily','0 8 * * *', 'select 1');
          exception when others then raise notice 'pré-enregistrement cron ignoré : %', sqlerrm;
          end $$;
          SQL

      - name: Appliquer les migrations (tolérant aux collisions d'idempotence)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mig
          log=/tmp/apply.log; : > "$log"
          last=$(ls supabase/migrations/*.sql | sort | tail -1)
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "→ $(basename "$f")"
            # Un log PAR fichier : le résumé global est agrégé et tronqué, donc
            # incapable de dire si UNE migration précise a échoué. C'est ce qui
            # a laissé passer un run « vert » alors que la dernière migration
            # n'avait rien créé.
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=0 -q -f "$f" \
              >"/tmp/mig/$(basename "$f").log" 2>&1 || true
            cat "/tmp/mig/$(basename "$f").log" >>"$log"
          done

          echo "==== Erreurs de la DERNIÈRE migration ($(basename "$last")) ===="
          # Intégralement, sans agrégation ni troncature : c'est celle que ce run
          # est censé livrer, elle ne se noie pas dans les collisions du passé.
          grep -E "ERROR:|FATAL:" "/tmp/mig/$(basename "$last").log" || echo "(aucune)"

          echo
          echo "==== Résumé des erreurs de TOUTES les migrations (tolérées) ===="
          grep -E "ERROR:|FATAL:" "$log" | sed -E 's/^psql:[^:]+:[0-9]+: //' | sort | uniq -c | sort -rn | head -60 || echo "(aucune)"

      - name: Recharger le cache de schéma PostgREST
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Une table peut exister en base et rester invisible via l'API REST
          # tant que PostgREST n'a pas rechargé son cache (PGRST205). Sans ce
          # rechargement, « la table n'existe pas » et « l'API ne la voit pas
          # encore » se ressemblent — et on ne saurait pas laquelle des deux on
          # regarde. Sans effet si le cache était déjà à jour.
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=0 -q -c "NOTIFY pgrst, 'reload schema';" || true

      - name: Vérifier le schéma (gate = 'assets' existe)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo -n "Tables publiques : "
          psql "$SUPABASE_DB_URL" -Atc "select count(*) from information_schema.tables where table_schema='public';"
          echo -n "assets : "
          if psql "$SUPABASE_DB_URL" -Atc "select count(*) || ' lignes' from public.assets;"; then
            echo "→ 'assets' OK"
          else
            echo "::error::'assets' absente — échec réel du schéma."; exit 1
          fi
          echo "Tables clés présentes :"
          psql "$SUPABASE_DB_URL" -Atc "select table_name from information_schema.tables where table_schema='public' and table_name in ('assets','asset_observations','agm_resolutions','resolution_votes') order by 1;" | tr '\n' ' '; echo

      # Le gate « assets existe » ne dit rien de la migration qu'on vient
      # d'ajouter : il passait au vert avec cinq tables manquantes. On vérifie
      # donc que les tables déclarées par la DERNIÈRE migration existent
      # vraiment. Aucune liste codée en dur : elle est extraite du fichier.
      - name: Vérifier les tables de la dernière migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          last=$(ls supabase/migrations/*.sql | sort | tail -1)
          echo "Dernière migration : $(basename "$last")"
          tables=$(grep -oiE 'CREATE TABLE( IF NOT EXISTS)? +public\.[a-z0-9_]+' "$last" \
                   | sed -E 's/.*public\.//' | sort -u)
          if [ -z "$tables" ]; then
            echo "Aucune table créée par cette migration — rien à vérifier."; exit 0
          fi
          missing=0
          for t in $tables; do
            if [ "$(psql "$SUPABASE_DB_URL" -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name='$t';")" = "1" ]; then
              echo "  ✓ $t"
            else
              echo "  ✗ $t — ABSENTE"; missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::La dernière migration n'a pas créé toutes ses tables. Voir « Erreurs de la DERNIÈRE migration » ci-dessus."
            exit 1
          fi
