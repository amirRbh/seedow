# Applique les migrations `supabase/migrations/` au projet, via la CLI officielle
# (`supabase db push --db-url`) — aucune édition manuelle du schéma, aucun access
# token requis (juste l'URL de connexion base).
# Déclenchement manuel. Secret requis :
#   SUPABASE_DB_URL  (chaîne de connexion « Session pooler », port 5432, IPv4)
#     ex. postgresql://postgres.<ref>:<motdepasse>@aws-0-<region>.pooler.supabase.com:5432/postgres
name: DB migrate (Supabase)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL manquant."; exit 1
          fi
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes

      - name: Vérifier que 'assets' existe
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "Tables publiques principales :"
          psql "$SUPABASE_DB_URL" -Atc \
            "select table_name from information_schema.tables where table_schema='public' order by 1;" | tr '\n' ' '
          echo
          echo -n "assets : "
          psql "$SUPABASE_DB_URL" -Atc "select count(*) from public.assets;" \
            && echo "→ 'assets' OK" || { echo "→ 'assets' ABSENTE"; exit 1; }
