# Applique le schéma `supabase/migrations/` à un projet Supabase vierge.
#
# Les migrations exportées par Lovable ne se rejouent PAS linéairement (des
# `CREATE TABLE` se recouvrent avec des définitions divergentes, des
# `cron.unschedule()` non gardés échouent sur base vierge). Plutôt que de
# modifier les fichiers de migration, on applique tout en mode TOLÉRANT
# (psql ON_ERROR_STOP=0) : les collisions d'idempotence (« already exists »,
# doublons) sont ignorées, le reste est appliqué. Le succès est conditionné à
# l'existence effective de `public.assets`. Chaque erreur ignorée est logguée.
#
# Secret requis : SUPABASE_DB_URL (chaîne « Session pooler », port 5432, IPv4).
name: DB migrate (Supabase)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Installer psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Pré-enregistrer les jobs pg_cron (les migrations font unschedule)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::error::Secret SUPABASE_DB_URL manquant."; exit 1; fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=0 <<'SQL'
          do $$
          begin
            perform cron.schedule('refresh-market-data-hourly', '0 * * * *', 'select 1');
            perform cron.schedule('refresh-market-data-daily',  '0 2 * * *', 'select 1');
            perform cron.schedule('dispatch-notifications-daily','0 8 * * *', 'select 1');
          exception when others then raise notice 'pré-enregistrement cron ignoré : %', sqlerrm;
          end $$;
          SQL

      - name: Appliquer les migrations (tolérant aux collisions d'idempotence)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          log=/tmp/apply.log; : > "$log"
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "→ $(basename "$f")"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=0 -q -f "$f" >>"$log" 2>&1 || true
          done
          echo "==== Résumé des erreurs rencontrées (toutes tolérées) ===="
          grep -E "ERROR:|FATAL:" "$log" | sed -E 's/^psql:[^:]+:[0-9]+: //' | sort | uniq -c | sort -rn | head -60 || echo "(aucune)"

      - name: Vérifier le schéma (gate = 'assets' existe)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo -n "Tables publiques : "
          psql "$SUPABASE_DB_URL" -Atc "select count(*) from information_schema.tables where table_schema='public';"
          echo -n "assets : "
          if psql "$SUPABASE_DB_URL" -Atc "select count(*) || ' lignes' from public.assets;"; then
            echo "→ 'assets' OK"
          else
            echo "::error::'assets' absente — échec réel du schéma."; exit 1
          fi
          echo "Tables clés présentes :"
          psql "$SUPABASE_DB_URL" -Atc "select table_name from information_schema.tables where table_schema='public' and table_name in ('assets','asset_observations','agm_resolutions','resolution_votes') order by 1;" | tr '\n' ' '; echo
