# Ingestion B1/B2 — job offline avec poppler (extraction PDF impossible sur l'edge).
# ISIN → GECO (identité + documents officiels) → pdftotext (SFDR/frais) → persistance.
# Déclenchement manuel (persistance opt-in) OU hebdomadaire (boucle de fraîcheur B2) :
# recompute-ingestion-plan-daily (pg_cron, 06h UTC) tient le backlog priorisé à jour
# (demande + fraîcheur + complétude) ; ce job le rejoue chaque lundi et persiste,
# fermant la boucle « fonds périmé détecté → ré-ingéré » sans intervention manuelle.
name: Ingest funds (GECO)

on:
  schedule:
    - cron: "0 7 * * 1" # hebdo, lundi 07h UTC — après recompute-ingestion-plan-daily
  workflow_dispatch:
    inputs:
      isins:
        description: "ISIN séparés par des espaces (vide = 5 ISIN de démo)"
        required: false
        default: ""
      discover:
        description: "Découvrir automatiquement N ISIN via GECO (prioritaire sur plan/isins)"
        required: false
        default: ""
      plan:
        description: "Reprendre le backlog priorisé (top N, cf. recompute-ingestion-plan ; prioritaire sur isins)"
        required: false
        default: ""
      persist:
        description: "Écrire en base (nécessite les secrets Supabase)"
        type: boolean
        required: false
        default: false
      dump:
        description: "Debug : logue le libellé réel des coûts/SFDR des KID"
        type: boolean
        required: false
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # poppler-utils fournit `pdftotext` — indispensable à l'extraction PDF,
      # absente du runtime edge (raison du job offline).
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ingest
        env:
          # Le run planifié (boucle de fraîcheur B2) persiste toujours ; le run manuel
          # reste opt-in via l'input `persist`.
          SEEDOW_PERSIST: ${{ (github.event_name == 'schedule' || inputs.persist) && '1' || '0' }}
          SEEDOW_DUMP: ${{ inputs.dump && '1' || '0' }}
          # Le client server lit ces variables ; renseigner les secrets du repo
          # pour activer la persistance (sinon le job se contente d'extraire + logguer).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            bun run scripts/ingest-funds.ts --plan 50
          elif [ -n "${{ inputs.discover }}" ]; then
            bun run scripts/ingest-funds.ts --discover "${{ inputs.discover }}"
          elif [ -n "${{ inputs.plan }}" ]; then
            bun run scripts/ingest-funds.ts --plan "${{ inputs.plan }}"
          else
            bun run scripts/ingest-funds.ts ${{ inputs.isins }}
          fi
